# Minimal SearXNG override. Inherits all upstream defaults, then enables the
# JSON output format that the web_search tool requires and disables the rate
# limiter (the MCP server is a trusted internal client).
use_default_settings: true

server:
  # Change this to a long random string (or keep it in sync with SEARXNG_SECRET).
  secret_key: "change-me-please"
  limiter: false
  image_proxy: true

search:
  formats:
    - html
    - json
