name: Clean Up Container Images

on:
  schedule:
    - cron: "17 14 * * 0"

  workflow_dispatch:
    inputs:
      dry_run:
        description: "Log what would be deleted without deleting it"
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      # Keep the moving tags used by deployments and, as a second safety net,
      # always keep the newest other tagged image. Older release and pull-request
      # images, along with untagged multi-architecture children, expire after
      # 90 days. The action removes OCI children with their parent manifest.
      - name: Delete old container images
        uses: dataaxiom/ghcr-cleanup-action@cd0cdb900b5dbf3a6f2cc869f0dbb0b8211f50c4 # v1.0.16
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ github.event.repository.name }}
          delete-tags: "*"
          exclude-tags: "latest,main"
          keep-n-tagged: 1
          delete-untagged: true
          older-than: "90 days"
          validate: true
          dry-run: ${{ inputs.dry_run || false }}
