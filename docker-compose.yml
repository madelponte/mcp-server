services:
  mcp-server:
    image: ghcr.io/madelponte/mcp-server:latest
    container_name: mcp-tools
    restart: unless-stopped
    # Configuration lives in ./config.yaml (copy config.example.yaml and edit).
    # Mounted read-only, so the file is the only thing the container needs and
    # secrets never end up in an image or a `docker inspect` env dump. The file
    # must be readable by the container's uid 10001 — on a Linux host, e.g.
    #   sudo setfacl -m u:10001:r config.yaml   (or chmod 644 for a laxer setup)
    volumes:
      - type: bind
        source: ./config.yaml
        target: /app/config.yaml
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "8000:8000"
    depends_on:
      - flaresolverr
      - tika

  # ---------------------------------------------------------------------------
  # Local support services for fetch_page. search_web uses Brave's hosted LLM
  # Context API and requires web_search.brave_api_key; it has no local backend.
  # ---------------------------------------------------------------------------
  tika:
    image: apache/tika:latest-full
    container_name: tika
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=America/New_York
    restart: unless-stopped
