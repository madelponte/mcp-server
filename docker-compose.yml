services:
  mcp-server:
    image: ghcr.io/madelponte/mcp-server:latest
    container_name: mcp-tools
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - flaresolverr
      - tika

  # ---------------------------------------------------------------------------
  # Local support services for fetch_page. search_web uses Brave's hosted LLM
  # Context API and requires WEB_SEARCH_BRAVE_API_KEY; it has no local backend.
  # ---------------------------------------------------------------------------
  tika:
    image: apache/tika:latest-full
    container_name: tika
    restart: unless-stopped

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    environment:
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LOG_HTML=${LOG_HTML:-false}
      - CAPTCHA_SOLVER=${CAPTCHA_SOLVER:-none}
      - TZ=America/New_York
    restart: unless-stopped
